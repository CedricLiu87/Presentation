<title id="title">Gap 5 | Where should tracking computation be allocated?</title><desc id="desc">A hypothetical shell game contains B/C and A/B crossings. Both may affect tracking; question risk may differ but can propagate through later associations. Budget allocation is a hypothesis, not a validated policy.</desc>
