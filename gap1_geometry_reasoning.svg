<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Gap 1 | Which evidence source should be trusted?</title><desc id="desc">Two frozen branches receive the same RGB frames. Observable reliability may route their predictions, but no routing benefit is established. Hypothetical reference-to-object distances illustrate an erroneous geometry ranking.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#50647a" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b40} .note{fill:#50647a} .hyp{stroke-dasharray:7 5}</style>
<rect width="1400" height="860" rx="18" fill="#ffffff"/>
<text x="40" y="48" font-size="30" text-anchor="start" style="fill:#172b40" font-weight="700">
<tspan x="40" dy="0">Gap 1 | Which evidence source should be trusted?</tspan>
</text>
<text x="40" y="80" font-size="18" text-anchor="start" style="fill:#50647a">
<tspan x="40" dy="0">Conceptual Illustration / Not Experimental Data</tspan>
</text>
<text x="50" y="123" font-size="17" text-anchor="start" style="fill:#50647a" font-weight="700">
<tspan x="50" dy="0">SAME OBSERVED RGB FRAMES</tspan>
</text>
<rect x="50" y="200" width="190" height="95" rx="14" fill="#f6f8fb" stroke="#172b40" stroke-width="2"/>
<text x="145.0" y="240.15" font-size="21" text-anchor="middle" style="fill:#172b40" font-weight="700">
<tspan x="145.0" dy="0">RGB / video</tspan>
<tspan x="145.0" dy="28.35">observation</tspan>
</text>
<path d="M240 230 H267 V170 H295" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M240 263 H267 V335 H295" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="295" y="125" width="220" height="90" rx="14" fill="#f2f7fd" stroke="#246aaf" stroke-width="2"/>
<text x="405.0" y="162.65" font-size="21" text-anchor="middle" style="fill:#246aaf" font-weight="700">
<tspan x="405.0" dy="0">Frozen VLM</tspan>
<tspan x="405.0" dy="28.35">implicit reasoning</tspan>
</text>
<rect x="550" y="125" width="220" height="90" rx="14" fill="#f2f7fd" stroke="#246aaf" stroke-width="2"/>
<text x="660.0" y="162.65" font-size="21" text-anchor="middle" style="fill:#246aaf" font-weight="700">
<tspan x="660.0" dy="0">VLM prediction</tspan>
<tspan x="660.0" dy="28.35">may be wrong</tspan>
</text>
<path d="M515 170 H550" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="295" y="290" width="220" height="90" rx="14" fill="#eef9f7" stroke="#087d79" stroke-width="2"/>
<text x="405.0" y="327.65000000000003" font-size="21" text-anchor="middle" style="fill:#087d79" font-weight="700">
<tspan x="405.0" dy="0">Real 3D estimator</tspan>
<tspan x="405.0" dy="28.35">+ geometric solver</tspan>
</text>
<rect x="550" y="290" width="220" height="90" rx="14" fill="#eef9f7" stroke="#087d79" stroke-width="2"/>
<text x="660.0" y="327.65000000000003" font-size="21" text-anchor="middle" style="fill:#087d79" font-weight="700">
<tspan x="660.0" dy="0">Geometry prediction</tspan>
<tspan x="660.0" dy="28.35">may be wrong</tspan>
</text>
<path d="M515 335 H550" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="295" y="413" font-size="17" text-anchor="start" style="fill:#50647a">
<tspan x="295" dy="0">Predicted K enables single-frame inference;</tspan>
<tspan x="295" dy="22.950000000000003">cross-frame comparison still needs aligned poses.</tspan>
</text>
<path d="M770 170 H805 V470 H700 V500" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 335 H790 V455 H600 V500" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="500" width="260" height="120" rx="14" fill="#fff8ed" stroke="#9a5a0b" stroke-width="2"/>
<text x="180.0" y="540.62" font-size="19" text-anchor="middle" style="fill:#9a5a0b" font-weight="700">
<tspan x="180.0" dy="0">Observable signals</tspan>
<tspan x="180.0" dy="25.650000000000002">confidence / consistency</tspan>
<tspan x="180.0" dy="25.650000000000002">estimated margin m_hat</tspan>
</text>
<path d="M310 560 H355" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="355" y="500" width="370" height="120" rx="14" fill="#fff8ed" stroke="#9a5a0b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="540.0" y="537.56" font-size="22" text-anchor="middle" style="fill:#9a5a0b" font-weight="700">
<tspan x="540.0" dy="0">Candidate evidence selection</tspan>
<tspan x="540.0" dy="29.700000000000003">dev-locked threshold</tspan>
<tspan x="540.0" dy="29.700000000000003">benefit remains unverified</tspan>
</text>
<path d="M540 620 V670" fill="none" stroke="#50647a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="355" y="670" width="370" height="80" rx="14" fill="#f6f8fb" stroke="#172b40" stroke-width="2"/>
<text x="540.0" y="703.0" font-size="20" text-anchor="middle" style="fill:#172b40" font-weight="700">
<tspan x="540.0" dy="0">Final decision</tspan>
<tspan x="540.0" dy="27.0">real paired outcome: UNKNOWN</tspan>
</text>
<text x="50" y="698" font-size="18" text-anchor="start" style="fill:#50647a">
<tspan x="50" dy="0">Ground truth is for</tspan>
<tspan x="50" dy="24.3">scoring and diagnosis only.</tspan>
<tspan x="50" dy="24.3">No Oracle routing inputs.</tspan>
</text>
<rect x="830" y="113" width="525" height="645" rx="14" fill="#f9fbfd" stroke="#d6e0ea" stroke-width="2"/>
<text x="855" y="149" font-size="19" text-anchor="start" style="fill:#172b40" font-weight="700">
<tspan x="855" dy="0">REFERENCE-TO-CANDIDATE DISTANCES</tspan>
</text>
<text x="855" y="179" font-size="16" text-anchor="start" style="fill:#50647a">
<tspan x="855" dy="0">Hypothetical metric values; scene not to scale.</tspan>
</text>
<path d="M860 360 L1050 210 L1330 395 L1120 470 Z" fill="#edf2f7" stroke="#d6e0ea" stroke-width="2"/>
<path d="M1038 230 l18 -18 h68 l-18 18 Z M1106 230 l18 -18 v65 l-18 18 Z" fill="#172b40" fill-opacity="0.25" stroke="#172b40" stroke-width="2"/>
<rect x="1038" y="230" width="68" height="65" rx="0" fill="#ffffff" stroke="#172b40" stroke-width="2"/>
<text x="1072.0" y="270.5" font-size="25" text-anchor="middle" style="fill:#172b40" font-weight="700">
<tspan x="1072.0" dy="0">R</tspan>
</text>
<path d="M879 367 l14 -14 h58 l-14 14 Z M937 367 l14 -14 v56 l-14 14 Z" fill="#246aaf" fill-opacity="0.25" stroke="#246aaf" stroke-width="2"/>
<rect x="879" y="367" width="58" height="56" rx="0" fill="#ffffff" stroke="#246aaf" stroke-width="2"/>
<text x="908.0" y="403.0" font-size="25" text-anchor="middle" style="fill:#246aaf" font-weight="700">
<tspan x="908.0" dy="0">A</tspan>
</text>
<path d="M1108 386 l14 -14 h58 l-14 14 Z M1166 386 l14 -14 v56 l-14 14 Z" fill="#ad3b46" fill-opacity="0.25" stroke="#ad3b46" stroke-width="2"/>
<rect x="1108" y="386" width="58" height="56" rx="0" fill="#ffffff" stroke="#ad3b46" stroke-width="2"/>
<text x="1137.0" y="422.0" font-size="25" text-anchor="middle" style="fill:#ad3b46" font-weight="700">
<tspan x="1137.0" dy="0">B</tspan>
</text>
<path d="M1248 280 l14 -14 h58 l-14 14 Z M1306 280 l14 -14 v56 l-14 14 Z" fill="#087d79" fill-opacity="0.25" stroke="#087d79" stroke-width="2"/>
<rect x="1248" y="280" width="58" height="56" rx="0" fill="#ffffff" stroke="#087d79" stroke-width="2"/>
<text x="1277.0" y="316.0" font-size="25" text-anchor="middle" style="fill:#087d79" font-weight="700">
<tspan x="1277.0" dy="0">C</tspan>
</text>
<path d="M1038 294 L938 367" fill="none" stroke="#246aaf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M1080 295 L1135 386" fill="none" stroke="#ad3b46" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M1125 259 L1248 299" fill="none" stroke="#087d79" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="880" y="320" font-size="18" text-anchor="start" style="fill:#246aaf" font-weight="700">
<tspan x="880" dy="0">2.4 m est.</tspan>
</text>
<text x="1165" y="355" font-size="18" text-anchor="start" style="fill:#ad3b46" font-weight="700">
<tspan x="1165" dy="0">2.1 m est.</tspan>
</text>
<text x="1180" y="235" font-size="18" text-anchor="start" style="fill:#087d79" font-weight="700">
<tspan x="1180" dy="0">3.6 m est.</tspan>
</text>
<text x="855" y="499" font-size="18" text-anchor="start" style="fill:#ad3b46" font-weight="700">
<tspan x="855" dy="0">Estimator chooses B; m_hat = 2.4 - 2.1 = 0.3 m</tspan>
</text>
<text x="855" y="541" font-size="19" text-anchor="start" style="fill:#172b40">
<tspan x="855" dy="0">Example truth: A=2.0, B=2.3, C=3.8 m</tspan>
<tspan x="855" dy="25.650000000000002">A is closest in this invented illustration.</tspan>
</text>
<path d="M850 591 H1332" fill="none" stroke="#d6e0ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="855" y="624" font-size="20" text-anchor="start" style="fill:#172b40" font-weight="700">
<tspan x="855" dy="0">Distance is between object surfaces,</tspan>
<tspan x="855" dy="27.0">not distance from the camera.</tspan>
</text>
<text x="855" y="698" font-size="18" text-anchor="start" style="fill:#50647a">
<tspan x="855" dy="0">Oracle values explain the error only;</tspan>
<tspan x="855" dy="24.3">they cannot enter a deployable selector.</tspan>
</text>
<text x="40" y="813" font-size="21" text-anchor="start" style="fill:#172b40" font-weight="700">
<tspan x="40" dy="0">Question: Is real error complementarity predictable from test-time signals, beyond the strongest fixed baseline?</tspan>
</text>
</svg>